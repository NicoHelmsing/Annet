# Publishes the website. Runs every hour, on every change to the code, and on demand
# (GitHub > Actions > "Website bijwerken" > Run workflow).
name: Website bijwerken

on:
  schedule:
    - cron: "17 * * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # only used for the monthly keep-alive commit
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Downloaded photos are kept between runs, so unchanged paintings are not fetched again.
      - uses: actions/cache@v4
        with:
          path: .cache/images
          key: images-${{ github.run_id }}
          restore-keys: images-

      - name: Build from Notion
        run: node scripts/build.mjs
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          NOTION_ABOUT_PAGE_ID: ${{ secrets.NOTION_ABOUT_PAGE_ID }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      # GitHub pauses scheduled jobs in repositories without commits for 60 days.
      # An empty commit once every ~45 days keeps the hourly update running.
      - name: Keep the schedule alive
        if: github.event_name == 'schedule'
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 45 * 86400 )) ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Keep scheduled website updates active"
            git push
          fi

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
